[project]
name = "nexusep"
version = "0.1.0"
description = "Nexus EUReCA Platform: an object-oriented urban energy simulation framework."
authors = [
    { name = "Mohamad Hasan Khajedehi" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }

dependencies = [
    "numpy",
    "pandas",
    "geopandas",
    "shapely",
    "pyproj",
    "rasterio",
    "scipy",
    "matplotlib",
    "lxml",
    "pydantic",
    "pyarrow",
    "pvlib==0.15.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy"
]
benchmark = [
    "numba",
    "psutil"
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nexusep*"]
exclude = ["artifacts*", "benchmarks*", "data*", "docs*", "outputs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=artifacts/test-temp"
markers = [
    "unit: isolated functions and state transitions",
    "contract: canonical schemas, units, IDs, graphs, and adapters",
    "integration: complete multi-component timesteps and short runs",
    "annual: 8,760-hour correctness and aggregation coverage",
    "benchmark: performance measurement, never scientific correctness",
    "slow: long-running integration or annual simulation coverage",
]
