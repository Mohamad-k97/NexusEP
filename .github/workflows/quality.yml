name: quality-gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: Run manual benchmark protocol checks
        required: false
        default: false
        type: boolean

jobs:
  pr-correctness:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --locked
      - run: uv run python -m nexusep.validation_data.registry check data/validation/registry.json
      - run: uv run pytest -m "unit or contract or (integration and not slow)"

  nightly-correctness:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      NEXUSEP_RUN_ANNUAL: "1"
      NEXUSEP_RUN_ANNUAL_REPEAT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --locked
      - run: uv run python -m nexusep.validation_data.registry check data/validation/registry.json
      - run: uv run pytest -m "integration or annual"

  benchmark-protocol:
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --locked
      - run: uv run pytest -m benchmark
